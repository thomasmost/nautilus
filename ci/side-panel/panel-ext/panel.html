<!doctype html>
<meta charset="utf-8">
<title>Side panel test</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 12px; }
  #pointer, #keys { font: 12px ui-monospace, monospace; white-space: pre-wrap; }
  input, select { font: inherit; width: 100%; box-sizing: border-box; margin: 6px 0; }
</style>
<h1 id="which">Window panel</h1>
<p>Pointer: <span id="pointer">(not over the panel)</span></p>
<input id="field" placeholder="Type here">
<select id="choice"><option>one</option><option>two</option><option>three</option></select>
<p>Keys: <span id="keys"></span></p>
<p><a id="link" href="https://example.net/" target="_blank">A link with a target</a></p>
<button id="close">window.close()</button>
<!-- A web page in a frame, with the sandbox attribute a real extension gives
     the site it embeds in its panel: panel.js gives it its address. -->
<iframe id="external" title="External message test" style="width: 100%; height: 40px; border: 0; margin-top: 8px"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
<script src="panel-probe.js"></script>
<script src="browser-facts.js"></script>
<script src="frames-probe.js"></script>
<script src="panel.js"></script>
