[workspace]
members = ["crates/nautilus-engine", "crates/nautilus", "xtask"]
# `cargo run` with no package flag runs the browser.
default-members = ["crates/nautilus"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# The shared shell (model, chrome, winit app): https://github.com/thomasmost/osmena.
# Pinned by revision; the five crates version together, so move every `rev`
# at once. For local work, patch the source to a checkout in
# ~/.cargo/config.toml (see osmena's README). winit, egui, and glow come
# through these crates, pinned there.
osmena-core = { git = "https://github.com/thomasmost/osmena", rev = "435e054cd9b69506c55a9e730c858c4f6bbe8f33" }
osmena-engine = { git = "https://github.com/thomasmost/osmena", rev = "435e054cd9b69506c55a9e730c858c4f6bbe8f33" }
osmena-shell = { git = "https://github.com/thomasmost/osmena", rev = "435e054cd9b69506c55a9e730c858c4f6bbe8f33" }
osmena-xtask = { git = "https://github.com/thomasmost/osmena", rev = "435e054cd9b69506c55a9e730c858c4f6bbe8f33" }
raw-window-handle = "0.6"
dpi = "0.1"
keyboard-types = { version = "0.8.3", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
log = "0.4"
# The Chromium Embedded Framework. The crate version tracks the CEF
# version; the sys crate downloads the matching binary distribution (or
# uses `CEF_PATH`) and builds libcef_dll_wrapper with CMake and Ninja.
# `nautilus_engine::INFO.version` names the Chromium major: bump both.
cef = { version = "=154.5.0", default-features = false }

[profile.release]
# Line tables only: enough to symbolize a crash dump or a cdb stack from the
# PDB (Windows) or dSYM (macOS) that CI uploads next to the installer, without
# changing the generated code. Neither file ships in the installer.
debug = "line-tables-only"
