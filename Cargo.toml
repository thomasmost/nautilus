[workspace]
members = ["crates/nautilus-core", "crates/nautilus-engine", "crates/nautilus", "xtask"]
# `cargo run` with no package flag runs the browser.
default-members = ["crates/nautilus"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# winit, egui, and glow share one GL context and raw window handles, so
# they are pinned to exact versions and bumped together.
winit = "=0.30.13"
egui = "=0.34.3"
egui-winit = { version = "=0.34.3", default-features = false }
egui_glow = { version = "=0.34.3", features = ["winit"] }
glow = "=0.17.0"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
dpi = "0.1"
keyboard-types = { version = "0.8.3", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
# The Chromium Embedded Framework. The crate version tracks the CEF
# version; the sys crate downloads the matching binary distribution (or
# uses `CEF_PATH`) and builds libcef_dll_wrapper with CMake and Ninja.
cef = { version = "=154.5.0", default-features = false }

[profile.release]
# Line tables only: enough to symbolize a crash dump or a cdb stack from the
# PDB (Windows) or dSYM (macOS) that CI uploads next to the installer, without
# changing the generated code. Neither file ships in the installer.
debug = "line-tables-only"
