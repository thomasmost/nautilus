name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The CEF binary distribution (about 420 MB unpacked) lives outside the
  # target directory so it is cached on its own and survives target cache
  # churn. cef-dll-sys downloads the matching version into it on a miss.
  CEF_PATH: ${{ github.workspace }}/.cef

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            check-icons: true
          # Intel Macs. GitHub retires its Intel runners with the
          # macOS 15 image, expected in fall 2027; decide in 2027
          # whether the Intel build is still worth keeping (README,
          # Known limitations).
          - os: macos-15-intel
            check-icons: false
          - os: windows-2025
            check-icons: false
    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain does not read rust-toolchain.toml; keep the
      # version in sync with it so rustup installs one toolchain, not two.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      # cef-dll-sys builds libcef_dll_wrapper with CMake and the Ninja
      # generator. The runner images ship CMake; Ninja is installed here.
      - uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Remove the runner image's preinstalled toolchains
        shell: bash
        run: |
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          for toolchain in $(rustup toolchain list --quiet); do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache the CEF binary distribution
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

      # tiny-skia's output is not guaranteed identical across CPU
      # architectures, so only the Apple Silicon runner diffs the icons.
      - name: Icons are up to date
        if: matrix.check-icons
        run: |
          cargo xtask icons
          git diff --exit-code -- assets/icons

  package:
    name: package ${{ matrix.os }}
    needs: check
    # Packaging runs on pushes to main only: the Windows installer from
    # cargo-packager, and the macOS app bundles (Apple silicon from
    # macos-15, Intel from macos-15-intel) from `cargo xtask
    # bundle-mac`, each started once on its runner as a smoke test
    # (README.md, Packaging).
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Remove the runner image's preinstalled toolchains
        shell: bash
        run: |
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          for toolchain in $(rustup toolchain list --quiet); do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Cache the CEF binary distribution
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # Windows: the NSIS installer.
      - if: runner.os == 'Windows'
        run: cargo install cargo-packager --version 0.11.8 --locked
      - if: runner.os == 'Windows'
        run: cargo build --release -p nautilus
      - if: runner.os == 'Windows'
        run: cargo packager --release -p nautilus
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: nautilus-${{ matrix.os }}
          path: |
            target/release/*-setup.exe
            target/release/nautilus.pdb
          if-no-files-found: error

      # macOS: the app bundle (built, laid out, and ad-hoc signed by the
      # xtask), its symbols, and a smoke run: the bundle is started on
      # a local page with `--exit-after`, must exit cleanly within the
      # time, and must have read the page's title (so Chromium's helper
      # processes ran from the bundle and rendered it). The logs of
      # every launch go up with the bundle.
      - if: runner.os == 'macOS'
        run: cargo xtask bundle-mac
      - if: runner.os == 'macOS'
        name: Symbols
        run: dsymutil target/release/nautilus -o target/release/Nautilus.dSYM
      - if: runner.os == 'macOS'
        name: Smoke test
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set +e
          app=target/release/Nautilus.app
          page="file://$PWD/ci/smoke.html"
          # The first launch of a fresh profile sometimes starts every
          # navigation and commits none on the Intel runner (C6 in
          # docs/upstream-issues.md); a second launch of the profile
          # loads at once. A launch that exits cleanly without the title
          # is tried again on the same profile, up to three times.
          for attempt in 1 2 3; do
            log="smoke-$attempt.log"
            "$app/Contents/MacOS/Nautilus" --profile ci-smoke --exit-after 30 "$page" > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 1 150); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::attempt $attempt: the browser did not exit within 150 s"
              kill -9 "$pid"
              cat "$log"
              exit 1
            fi
            wait "$pid"
            code=$?
            echo "::group::attempt $attempt (exit code $code)"
            cat "$log"
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error::attempt $attempt: the browser exited with code $code"
              exit 1
            fi
            if grep -q '"Nautilus smoke test"' "$log"; then
              if [ "$attempt" -gt 1 ]; then
                echo "::warning::the page's title arrived on attempt $attempt: the first launch of the fresh profile stalled (C6 in docs/upstream-issues.md)"
              fi
              exit 0
            fi
            echo "attempt $attempt: the page's title never reached the browser"
          done
          echo "::error::the page's title never reached the browser in three launches"
          exit 1
      # The zips carry the architecture (`arm64` or `x86_64`) so the
      # two macOS artifacts' files tell apart once downloaded.
      - if: runner.os == 'macOS'
        name: Zip the bundle
        run: |
          cd target/release
          arch=$(uname -m)
          ditto -c -k --keepParent Nautilus.app "Nautilus-macos-$arch.zip"
          ditto -c -k --keepParent Nautilus.dSYM "Nautilus-$arch.dSYM.zip"
      - if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v7
        with:
          name: nautilus-${{ matrix.os }}
          path: |
            target/release/Nautilus-macos-*.zip
            target/release/Nautilus-*.dSYM.zip
            smoke-*.log
          if-no-files-found: error
      - if: runner.os == 'macOS' && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::the smoke test failed; the bundle was uploaded anyway"
          exit 1
