[package]
name = "nautilus-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Chromium glue: the only crate that imports the cef crate; implements osmena's Engine"

[dependencies]
osmena-core = { workspace = true }
# Chromium paints into memory, so the chrome's GL context is the shell's
# glutin one.
osmena-engine = { workspace = true, features = ["glutin"] }
cef = { workspace = true }
dpi = { workspace = true }
keyboard-types = { workspace = true }
log = { workspace = true }
url = { workspace = true }
raw-window-handle = { workspace = true }
# Extensions: manifests and the management page's messages are JSON, a
# store download is a zip, icons are PNGs.
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
png = "0.18"
# An extension id is the hash of its key; a store CRX carries the store's
# key too, so the right one is found by hashing.
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# Giving winit's NSApplication the protocol CEF requires (mac_app.rs),
# and the borderless window that holds an extension's action popup
# (popup.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSGraphics",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSGeometry",
] }

[target.'cfg(windows)'.dependencies]
# The hidden window that hosts the extension manager, and placing the
# action popups.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
